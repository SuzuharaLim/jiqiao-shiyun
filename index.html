<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ interactive-widget=resizes-content：手機鍵盤彈出時讓「版面視窗」跟著縮，
         100dvh 才會變小。少了它，鍵盤會直接蓋住底部的輸入列（留言、AI 對話），
         使用者看不到自己在打什麼。
         ⚠️ 不可加 user-scalable=no / maximum-scale——那會禁止雙指放大，違反無障礙。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="機巧時運 — 智慧互動農民曆．社群攝影．AI 時光顧問，虛實整合的會說話文化手帳。" />
    <!-- ⚠️ 分頁圖示的快取獨立於 HTTP 快取，改了圖檔瀏覽器常常還是顯示舊的。
         換圖時把 ?v= 的號碼 +1，才會真的更新（否則使用者得開無痕視窗才看得到）。 -->
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=5" />
    <title>機巧時運 · 智慧互動農民曆</title>

    <!-- 社群分享 (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="機巧時運" />
    <meta property="og:title" content="機巧時運 · 智慧互動農民曆" />
    <meta property="og:description" content="智慧互動農民曆 × 節氣攝影社群 × AI 時光顧問，虛實整合的會說話文化手帳。" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="機巧時運 · 智慧互動農民曆" />
    <meta name="twitter:description" content="智慧互動農民曆 × 節氣攝影社群 × AI 時光顧問。" />
  </head>
  <body>
    <!-- 在 React 掛載前就套用記住的主題，避免深色使用者看到白色閃爍（外部檔以符合 CSP） -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
