<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ interactive-widget=resizes-content：手機鍵盤彈出時讓「版面視窗」跟著縮，
         100dvh 才會變小。少了它，鍵盤會直接蓋住底部的輸入列（留言、AI 對話），
         使用者看不到自己在打什麼。
         ⚠️ 不可加 user-scalable=no / maximum-scale——那會禁止雙指放大，違反無障礙。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- ⚠️ theme-color 要兩組：深色模式的使用者若只給白色，手機瀏覽器的網址列
         會是刺眼的白，與 App 內的深色底不連續。深色主題本身早就有（styles.css）。 -->
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <!-- ⚠️ 沒有這一行，Google 在 Discover 與搜尋結果只會給小縮圖，Discover 幾乎進不去。
         這個站有節氣攝影社群＝源源不絕的獨家高畫質圖，是農民曆競品都沒有的資產，
         不開大圖預覽等於自願棄權。max-snippet:-1 一併放開摘要長度。 -->
    <meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="今天宜什麼？機巧時運用 AI 把國民曆讀成人話——每日宜忌、吉時、沖煞白話解釋，加上二十四節氣與節氣攝影社群。" />
    <!-- ⚠️ 分頁圖示的快取獨立於 HTTP 快取，改了圖檔瀏覽器常常還是顯示舊的。
         換圖時把 ?v= 的號碼 +1，才會真的更新（否則使用者得開無痕視窗才看得到）。 -->
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="機巧時運｜每日國民曆" href="/feed.xml" />
    <link rel="canonical" href="https://chengqi.tw/" />
    <title>機巧時運 · 智慧互動國民曆</title>

    <!-- 社群分享 (Open Graph / Twitter)
         ⚠️ og:image 不可省：少了它，分享到 LINE／FB／Threads 只會是一塊純文字灰卡。
         對「節氣攝影社群」這種靠使用者分享作品成長的產品，等於把成長引擎的燃料管拔掉。
         ⚠️ 圖必須是 PNG/JPG 且為絕對網址——這些平台的抓取器不執行 JS，也不吃 SVG。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="機巧時運" />
    <meta property="og:title" content="機巧時運 · 智慧互動國民曆" />
    <meta property="og:description" content="今天宜什麼？AI 幫你把國民曆讀成人話。每日宜忌 · 二十四節氣 · 節氣攝影社群。" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:url" content="https://chengqi.tw/" />
    <meta property="og:image" content="https://chengqi.tw/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="機巧時運 — 智慧互動國民曆" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="機巧時運 · 智慧互動國民曆" />
    <meta name="twitter:description" content="今天宜什麼？AI 幫你把國民曆讀成人話。" />
    <meta name="twitter:image" content="https://chengqi.tw/og-default.jpg" />

    <!-- 結構化資料：讓搜尋引擎認得品牌與網站（知識面板／SERP 版面） -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@graph":[
      {"@type":"Organization","@id":"https://chengqi.tw/#org","name":"機巧時運",
       "legalName":"承氣有限公司","url":"https://chengqi.tw/","logo":"https://chengqi.tw/icon-512.png",
       "address":{"@type":"PostalAddress","addressCountry":"TW","addressRegion":"臺灣"},
       "contactPoint":{"@type":"ContactPoint","contactType":"customer support",
         "email":"hello@chengqi.tw","availableLanguage":["zh-Hant"]},
       "knowsAbout":["二十四節氣","國民曆","農民曆","擇日","干支曆法","台灣民俗"]},
      {"@type":"WebSite","@id":"https://chengqi.tw/#site","url":"https://chengqi.tw/",
       "name":"機巧時運","inLanguage":"zh-Hant-TW","publisher":{"@id":"https://chengqi.tw/#org"},
       "description":"用 AI 把國民曆（農民曆）讀成人話的每日宜忌與二十四節氣攝影社群。"}
    ]}
    </script>
  </head>
  <body>
    <!-- 在 React 掛載前就套用記住的主題，避免深色使用者看到白色閃爍（外部檔以符合 CSP） -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
